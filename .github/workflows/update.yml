name: Update packages

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake inputs
        run: nix flake update

      - name: Update package versions
        run: bash scripts/update-packages.sh

      - uses: peter-evans/create-pull-request@v7
        id: create-pr
        with:
          commit-message: 'chore: update packages'
          title: 'chore: update packages'
          body: |
            Automated weekly update:
            - `nix flake update` (nixpkgs)
            - PyPI version bumps for `apm-cli`, `azure-ai-inference`, `llm-github-models`
          branch: auto-update
          delete-branch: true

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
