name: Update packages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-apm-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Update apm-cli
        run: |
          nix run nixpkgs#nix-update -- \
            --flake \
            --version=pypi \
            packages.x86_64-linux.apm-cli
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update/apm-cli
          title: "update: apm-cli"
          commit-message: "update: apm-cli"
          body: Automated version update via nix-update.
          delete-branch: true
